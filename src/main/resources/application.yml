spring:
  application:
    name: incident-platform
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/incident_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${INCIDENT_DB_USERNAME:incident_app}
    password: ${INCIDENT_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
app:
  security:
    api-key: ${INCIDENT_API_KEY:}
  llm:
    provider: deepseek
    api-key: ${DEEP_SEEK_API_KEY:}
    base-url: https://api.deepseek.com
    model: deepseek-chat
    timeout: ${INCIDENT_LLM_TIMEOUT:30s}
    max-retries: ${INCIDENT_LLM_MAX_RETRIES:1}
  rag:
    embedding:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
      connect-timeout: ${OLLAMA_CONNECT_TIMEOUT:3s}
      read-timeout: ${OLLAMA_READ_TIMEOUT:15s}
  observability:
      prometheus-url: http://localhost:9090
      loki-url: http://localhost:3100
      demo-enabled: false
      connect-timeout: ${OBSERVABILITY_CONNECT_TIMEOUT:3s}
      read-timeout: ${OBSERVABILITY_READ_TIMEOUT:5s}
  investigation:
    max-steps: ${INCIDENT_INVESTIGATION_MAX_STEPS:3}
  knowledge:
    import:
      project-name: 求职agent
      dir: knowledge-import/job-agent-documents
logging:
  file:
    name: logs/incident-platform.log
