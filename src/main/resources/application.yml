spring:
  application:
    name: incident-platform
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/incident_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${INCIDENT_DB_USERNAME:incident_app}
    password: ${INCIDENT_DB_PASSWORD:REDACTED_DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
app:
  security:
    api-key: ${INCIDENT_API_KEY:}
  llm:
    provider: deepseek
    api-key: ${DEEP_SEEK_API_KEY:}
    base-url: https://api.deepseek.com
    model: deepseek-chat
  observability:
      prometheus-url: http://localhost:9090
      loki-url: http://localhost:3100
      demo-enabled: false
logging:
  file:
    name: logs/incident-platform.log
