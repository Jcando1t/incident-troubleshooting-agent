<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>故障排查平台</title>
  <style>
    :root{--bg:#f4f7fb;--panel:#fff;--ink:#172033;--muted:#6b7588;--line:#e5eaf2;--primary:#315efb;--primary-dark:#244bd3;--good:#16835b;--warn:#b66d00;--bad:#c23b4b;--shadow:0 12px 32px rgba(35,55,90,.08)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 Inter,"Microsoft YaHei",system-ui,sans-serif} button,input,select,textarea{font:inherit} button{cursor:pointer;border:0}
    .hidden{display:none!important}.app{min-height:100vh}.topbar{height:68px;background:#101a33;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700}.brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#5b82ff,#35c8b4);font-size:18px}.top-actions{display:flex;align-items:center;gap:16px}.connection{font-size:12px;color:#b9c7e8}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#43d39e;margin-right:6px}.ghost{color:#d8e1fa;background:transparent;padding:8px 10px;border-radius:8px}.ghost:hover{background:#1d2a4d}.layout{display:flex;max-width:1440px;margin:auto}.sidebar{width:220px;padding:28px 18px}.nav-title{color:#929db0;font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin:12px 12px}.nav-btn{display:block;width:100%;text-align:left;background:transparent;color:#657086;padding:11px 13px;border-radius:10px;margin:4px 0}.nav-btn.active,.nav-btn:hover{background:#e9efff;color:var(--primary);font-weight:600}.main{flex:1;min-width:0;padding:30px 30px 60px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px}.eyebrow{color:var(--primary);font-weight:700;font-size:12px;letter-spacing:.08em}.page-head h1{margin:3px 0 4px;font-size:28px;line-height:1.25}.sub{color:var(--muted);margin:0}.primary{background:var(--primary);color:#fff;padding:11px 17px;border-radius:9px;font-weight:700;box-shadow:0 5px 12px rgba(49,94,251,.2)}.primary:hover{background:var(--primary-dark)}.secondary{background:#edf1f8;color:#43516b;padding:10px 15px;border-radius:9px;font-weight:600}.danger{background:#fff0f1;color:var(--bad);padding:10px 15px;border-radius:9px;font-weight:600}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:17px 19px}.stat-label{color:var(--muted);font-size:12px}.stat-value{font-size:28px;font-weight:750;margin-top:4px}.stat-hint{font-size:12px;color:var(--muted)}.panel{padding:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.panel-title{font-size:16px;font-weight:750}.filters{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:10px;padding:14px;background:#f8faff;border:1px solid #e8edfa;border-radius:11px;margin-bottom:16px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--muted);font-weight:600}.field input,.field select,.field textarea,.login-card input{width:100%;border:1px solid #d8dfeb;border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink);outline:0}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus,.login-card input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(49,94,251,.1)}.filter-actions{display:flex;align-items:end;gap:8px}.incident-list{display:grid;gap:10px}.incident{border:1px solid var(--line);border-radius:11px;padding:15px 16px;display:grid;grid-template-columns:1fr auto;gap:15px;transition:.15s;background:#fff}.incident:hover{border-color:#b9c9fb;box-shadow:0 5px 16px rgba(35,55,90,.06)}.incident-title{font-size:15px;font-weight:700;margin:0 0 4px}.incident-meta{color:var(--muted);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}.incident-desc{color:#566278;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}.badge.awaiting,.badge.awaiting-approval{background:#fff4df;color:var(--warn)}.badge.approved,.badge.resolved{background:#e5f7ef;color:var(--good)}.badge.rejected,.badge.escalated{background:#ffeaed;color:var(--bad)}.badge.received,.badge.analyzing{background:#eaf0ff;color:var(--primary)}.empty{text-align:center;color:var(--muted);padding:40px 15px}.loading{text-align:center;padding:32px;color:var(--muted)}.toast{position:fixed;right:22px;bottom:22px;padding:12px 17px;background:#172033;color:#fff;border-radius:9px;box-shadow:var(--shadow);z-index:20}.modal-wrap{position:fixed;inset:0;background:rgba(12,20,40,.42);display:grid;place-items:center;padding:18px;z-index:10}.modal{background:#fff;border-radius:15px;width:min(680px,100%);max-height:90vh;overflow:auto;box-shadow:0 22px 70px rgba(14,25,53,.25);padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal h2{margin:0;font-size:20px}.close{background:#f1f4f9;color:#68758b;border-radius:8px;width:32px;height:32px;font-size:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.detail-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.detail-section{border-top:1px solid var(--line);padding-top:15px;margin-top:15px}.detail-section:first-child{border-top:0;padding-top:0;margin-top:0}.detail-section h3{font-size:13px;margin:0 0 8px}.detail-text{white-space:pre-wrap;color:#566278}.kv{display:grid;grid-template-columns:120px 1fr;gap:7px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}.step{border:1px solid var(--line);border-radius:9px;padding:11px;margin:8px 0}.step-top{display:flex;justify-content:space-between;gap:10px}.mono{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;background:#f5f7fb;padding:8px;border-radius:6px;white-space:pre-wrap;word-break:break-word;margin-top:7px}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#dfe9ff,transparent 35%),linear-gradient(135deg,#101a33,#1c3b6d);padding:18px}.login-card{width:min(430px,100%);background:#fff;border-radius:18px;padding:36px;box-shadow:0 25px 80px rgba(4,13,34,.3)}.login-card h1{margin:0 0 8px;font-size:25px}.login-card p{color:var(--muted);margin:0 0 25px}.login-card .primary{width:100%;margin-top:14px}.login-tip{background:#f5f8ff;color:#61708a;border-radius:9px;padding:10px 12px;font-size:12px;margin-top:16px}.knowledge-placeholder{color:var(--muted);padding:35px;text-align:center}.knowledge-placeholder strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
    @media(max-width:900px){.sidebar{display:none}.main{padding:22px 16px}.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.filter-actions{grid-column:1/-1}.detail-grid{grid-template-columns:1fr}}
    @media(max-width:560px){.topbar{padding:0 16px}.connection{display:none}.page-head{display:block}.page-head .primary{margin-top:14px}.stats{gap:8px}.stat{padding:13px}.stat-value{font-size:23px}.filters,.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.incident{grid-template-columns:1fr}.login-card{padding:26px}}
  </style>
</head>
<body>
  <div id="login" class="login">
    <section class="login-card">
      <div class="brand-mark">✦</div>
      <h1>进入故障排查平台</h1>
      <p>集中查看事件、证据和修复建议，让排查过程更清楚。</p>
      <div class="field"><label for="api-key">API Key</label><input id="api-key" type="password" autocomplete="off" placeholder="请输入服务端 API Key"></div>
      <button id="login-btn" class="primary">进入控制台</button>
      <div class="login-tip">密钥只保存在当前浏览器会话中，关闭标签页后会自动清除。</div>
    </section>
  </div>
  <div id="app" class="app hidden">
    <header class="topbar"><div class="brand"><span class="brand-mark">✦</span>故障排查平台</div><div class="top-actions"><span class="connection"><span class="dot"></span><span id="connection-text">已连接</span></span><button id="logout-btn" class="ghost">退出</button></div></header>
    <div class="layout">
      <aside class="sidebar"><div class="nav-title">工作台</div><button class="nav-btn active" data-view="incidents">◉　事件中心</button><button class="nav-btn" data-view="knowledge">▤　项目知识库</button><div class="nav-title" style="margin-top:34px">当前项目</div><select id="project-select" class="field" style="margin:0 8px;width:calc(100% - 16px);padding:8px"></select><button id="new-project-btn" class="nav-btn">＋　新建项目</button></aside>
      <main class="main">
        <section id="incident-view">
          <div class="page-head"><div><div class="eyebrow">OPERATIONS CENTER</div><h1>事件中心</h1><p class="sub">先看影响范围，再决定是否批准修复方案。</p></div><button id="new-incident-btn" class="primary">＋ 创建故障事件</button></div>
          <div class="stats"><div class="stat"><div class="stat-label">全部事件</div><div id="stat-total" class="stat-value">—</div><div class="stat-hint">当前项目</div></div><div class="stat"><div class="stat-label">待审批</div><div id="stat-awaiting" class="stat-value">—</div><div class="stat-hint">需要人工确认</div></div><div class="stat"><div class="stat-label">已批准</div><div id="stat-approved" class="stat-value">—</div><div class="stat-hint">已进入执行阶段</div></div><div class="stat"><div class="stat-label">已升级</div><div id="stat-escalated" class="stat-value">—</div><div class="stat-hint">证据不足或高风险</div></div></div>
          <section class="panel"><div class="panel-head"><div class="panel-title">事件列表</div><button id="refresh-btn" class="secondary">↻ 刷新</button></div><div class="filters"><div class="field"><label>状态</label><select id="filter-status"><option value="">全部状态</option><option>RECEIVED</option><option>ANALYZING</option><option>AWAITING_APPROVAL</option><option>APPROVED</option><option>REJECTED</option><option>RESOLVED</option><option>ESCALATED</option></select></div><div class="field"><label>服务名称</label><input id="filter-service" placeholder="例如 incident-platform"></div><div class="field"><label>创建时间（最近）</label><select id="filter-days"><option value="">不限时间</option><option value="1">最近 1 天</option><option value="7">最近 7 天</option><option value="30">最近 30 天</option></select></div><div class="filter-actions"><button id="filter-btn" class="primary">筛选</button></div></div><div id="incident-list" class="incident-list"><div class="loading">正在加载事件…</div></div></section>
        </section>
        <section id="knowledge-view" class="hidden"><div class="page-head"><div><div class="eyebrow">PROJECT KNOWLEDGE</div><h1>项目知识库</h1><p class="sub">资料按项目隔离，供排查流程检索参考。</p></div><button id="new-doc-btn" class="primary">＋ 添加资料</button></div><section class="panel"><div class="panel-head"><div class="panel-title">知识资料</div><button id="knowledge-refresh-btn" class="secondary">↻ 刷新</button></div><div id="knowledge-list"><div class="loading">正在加载资料…</div></div></section></section>
      </main>
    </div>
  </div>
  <div id="modal-wrap" class="modal-wrap hidden"><section id="modal" class="modal"></section></div><div id="toast" class="toast hidden"></div>
  <script>
    const state={key:sessionStorage.getItem('incident-api-key')||'',projects:[],projectId:sessionStorage.getItem('incident-project-id')||'',incidents:[]};
    const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const labels={RECEIVED:'已接收',ANALYZING:'分析中',AWAITING_APPROVAL:'待审批',APPROVED:'已批准',REJECTED:'已拒绝',RESOLVED:'已解决',ESCALATED:'已升级'};
    function toast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2800)}
    async function api(path,options={}){const headers={'X-API-Key':state.key,'Content-Type':'application/json',...(options.headers||{})};const res=await fetch(path,{...options,headers});let body=null;try{body=await res.json()}catch{}if(!res.ok)throw new Error(body?.message||`请求失败（${res.status}）`);return body}
    function showModal(html){$('modal').innerHTML=html;$('modal-wrap').classList.remove('hidden');} function closeModal(){$('modal-wrap').classList.add('hidden')}
    function statusBadge(status){return `<span class="badge ${String(status).toLowerCase().replace('_','-')}">${esc(labels[status]||status)}</span>`}
    function formatDate(value){if(!value)return '—';return new Date(value).toLocaleString('zh-CN',{hour12:false})}
    async function loadProjects(){state.projects=await api('/api/projects');const select=$('project-select');select.innerHTML=state.projects.length?state.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join(''):'<option value="">暂无项目，请新建</option>';if(state.projects.some(p=>p.id===state.projectId))select.value=state.projectId;else if(state.projects[0]){state.projectId=state.projects[0].id;select.value=state.projectId;sessionStorage.setItem('incident-project-id',state.projectId)}await loadIncidents()}
    async function loadIncidents(){if(!state.projectId){renderIncidents([]);return}const params=new URLSearchParams({limit:'100',projectId:state.projectId});const status=$('filter-status').value,service=$('filter-service').value.trim(),days=$('filter-days').value;if(status)params.set('status',status);if(service)params.set('service',service);if(days){const from=new Date(Date.now()-Number(days)*86400000);params.set('createdFrom',from.toISOString())}try{state.incidents=await api('/api/incidents?'+params);renderIncidents(state.incidents)}catch(e){$('incident-list').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
    function renderIncidents(items){$('stat-total').textContent=items.length;$('stat-awaiting').textContent=items.filter(i=>i.status==='AWAITING_APPROVAL').length;$('stat-approved').textContent=items.filter(i=>i.status==='APPROVED').length;$('stat-escalated').textContent=items.filter(i=>i.status==='ESCALATED').length;if(!items.length){$('incident-list').innerHTML='<div class="empty">当前项目还没有符合条件的事件。<br>点击右上角“创建故障事件”开始一次排查。</div>';return}$('incident-list').innerHTML=items.map(i=>`<article class="incident"><div><h3 class="incident-title">${esc(i.title)}</h3><div class="incident-meta"><span>${esc(i.service)}</span><span>${esc(i.environment)}</span><span>${esc(i.severity)}</span><span>${formatDate(i.createdAt)}</span></div><div class="incident-desc">${esc(i.description)}</div></div><div style="display:flex;align-items:center;gap:10px">${statusBadge(i.status)}<button class="secondary detail-btn" data-id="${i.id}">查看详情</button></div></article>`).join('');document.querySelectorAll('.detail-btn').forEach(b=>b.onclick=()=>openIncident(b.dataset.id))}
    async function openIncident(id){try{const i=await api(`/api/incidents/${id}?projectId=${state.projectId}`);const steps=i.remediation?.steps||[];showModal(`<div class="modal-head"><div><div class="eyebrow">INCIDENT DETAIL</div><h2>${esc(i.title)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="detail-grid"><div><div class="detail-section"><dl class="kv"><dt>状态</dt><dd>${statusBadge(i.status)}</dd><dt>服务</dt><dd>${esc(i.service)}</dd><dt>环境</dt><dd>${esc(i.environment)}</dd><dt>严重级别</dt><dd>${esc(i.severity)}</dd><dt>创建时间</dt><dd>${formatDate(i.createdAt)}</dd></dl></div><div class="detail-section"><h3>事件描述</h3><div class="detail-text">${esc(i.description)}</div></div><div class="detail-section"><h3>根因分析</h3><div class="detail-text">${esc(i.rca?.primaryCause||'暂无')}</div></div></div><div><div class="detail-section"><h3>修复建议</h3>${steps.length?steps.map((s,n)=>`<div class="step"><div class="step-top"><strong>${n+1}. ${esc(s.description)}</strong>${statusBadge(s.risk)}</div><div class="mono">${esc(s.command)}</div></div>`).join(''):'暂无修复建议'}</div><div class="detail-section"><h3>证据</h3><div class="detail-text">${(i.evidence?.items||[]).map(e=>`• ${esc(e.source)}：${esc(e.summary)}`).join('\n')||'暂无证据'}</div></div></div></div>${i.status==='AWAITING_APPROVAL'?`<div class="modal-actions"><button class="danger" onclick="approveIncident('${i.id}',false)">拒绝方案</button><button class="primary" onclick="approveIncident('${i.id}',true)">批准方案</button></div>`:''}`)}catch(e){toast(e.message)}}
    async function approveIncident(id,approved){const comment=prompt(approved?'可填写审批备注（可选）':'请输入拒绝原因（可选）','');try{await api(`/api/incidents/${id}/approval?projectId=${state.projectId}`,{method:'POST',body:JSON.stringify({approved,comment})});closeModal();toast(approved?'已批准修复方案':'已拒绝修复方案');loadIncidents()}catch(e){toast(e.message)}}
    function showNewProject(){showModal(`<div class="modal-head"><h2>新建项目</h2><button class="close" onclick="closeModal()">×</button></div><form id="project-form"><div class="field"><label>项目名称</label><input name="name" required maxlength="100" placeholder="例如：订单服务项目"></div><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">取消</button><button class="primary">创建项目</button></div></form>`);$('project-form').onsubmit=async e=>{e.preventDefault();try{const p=await api('/api/projects',{method:'POST',body:JSON.stringify({name:new FormData(e.target).get('name')})});state.projectId=p.id;sessionStorage.setItem('incident-project-id',p.id);closeModal();await loadProjects();toast('项目已创建')}catch(err){toast(err.message)}}}
    function showNewIncident(){if(!state.projectId){toast('请先创建或选择项目');return}showModal(`<div class="modal-head"><h2>创建故障事件</h2><button class="close" onclick="closeModal()">×</button></div><form id="incident-form"><div class="form-grid"><div class="field full"><label>事件标题</label><input name="title" required placeholder="例如：订单接口响应变慢"></div><div class="field"><label>服务名称</label><input name="service" required value="incident-platform"></div><div class="field"><label>环境</label><input name="environment" required value="local"></div><div class="field"><label>初始严重级别</label><select name="severity"><option>P3</option><option>P2</option><option>P1</option><option>P0</option></select></div><div class="field full"><label>问题描述</label><textarea name="description" required placeholder="描述你观察到的现象、时间和影响"></textarea></div></div><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">取消</button><button class="primary">提交并开始分析</button></div></form>`);$('incident-form').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.projectId=state.projectId;try{const i=await api('/api/incidents',{method:'POST',body:JSON.stringify(d)});closeModal();toast(`事件已提交，当前状态：${labels[i.status]||i.status}`);loadIncidents()}catch(err){toast(err.message)}}}
    async function loadKnowledge(){if(!state.projectId){$('knowledge-list').innerHTML='<div class="knowledge-placeholder">请先选择项目。</div>';return}try{const docs=await api(`/api/projects/${state.projectId}/knowledge-documents`);$('knowledge-list').innerHTML=docs.length?docs.map(d=>`<div class="incident"><div><h3 class="incident-title">${esc(d.title)}</h3><div class="incident-meta">更新于 ${formatDate(d.updatedAt)}</div><div class="incident-desc">${esc(d.content.slice(0,180))}</div></div><button class="secondary index-btn" data-id="${d.id}">建立索引</button></div>`).join(''):'<div class="knowledge-placeholder"><strong>知识库还是空的</strong>添加项目手册、故障案例或运行规范，排查时就能按项目检索。</div>';document.querySelectorAll('.index-btn').forEach(b=>b.onclick=async()=>{try{const r=await api(`/api/projects/${state.projectId}/knowledge-documents/${b.dataset.id}/embedding/index`,{method:'POST'});toast(`索引完成，共 ${r.chunks} 个片段`)}catch(e){toast(e.message)}})}catch(e){$('knowledge-list').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
    function showNewDoc(){if(!state.projectId){toast('请先创建或选择项目');return}showModal(`<div class="modal-head"><h2>添加知识资料</h2><button class="close" onclick="closeModal()">×</button></div><form id="doc-form"><div class="field"><label>资料标题</label><input name="title" required maxlength="255" placeholder="例如：支付服务故障排查手册"></div><div class="field" style="margin-top:14px"><label>资料内容</label><textarea name="content" required maxlength="200000" style="min-height:220px" placeholder="粘贴纯文本手册或历史案例"></textarea></div><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">取消</button><button class="primary">保存资料</button></div></form>`);$('doc-form').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await api(`/api/projects/${state.projectId}/knowledge-documents`,{method:'POST',body:JSON.stringify(d)});closeModal();toast('资料已保存，请点击“建立索引”');loadKnowledge()}catch(err){toast(err.message)}}}
    function enter(){if(!$('api-key').value.trim()){toast('请输入 API Key');return}state.key=$('api-key').value.trim();sessionStorage.setItem('incident-api-key',state.key);$('login').classList.add('hidden');$('app').classList.remove('hidden');loadProjects().catch(e=>{toast(e.message);logout()})}
    function logout(){state.key='';sessionStorage.removeItem('incident-api-key');$('app').classList.add('hidden');$('login').classList.remove('hidden');$('api-key').value=''}
    $('login-btn').onclick=enter;$('api-key').onkeydown=e=>{if(e.key==='Enter')enter()};$('logout-btn').onclick=logout;$('refresh-btn').onclick=loadIncidents;$('filter-btn').onclick=loadIncidents;$('new-project-btn').onclick=showNewProject;$('new-incident-btn').onclick=showNewIncident;$('new-doc-btn').onclick=showNewDoc;$('knowledge-refresh-btn').onclick=loadKnowledge;$('project-select').onchange=e=>{state.projectId=e.target.value;sessionStorage.setItem('incident-project-id',state.projectId);if(!$('incident-view').classList.contains('hidden'))loadIncidents();else loadKnowledge()};document.querySelectorAll('.nav-btn[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav-btn[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const knowledge=b.dataset.view==='knowledge';$('incident-view').classList.toggle('hidden',knowledge);$('knowledge-view').classList.toggle('hidden',!knowledge);if(knowledge)loadKnowledge()});$('modal-wrap').onclick=e=>{if(e.target===$('modal-wrap'))closeModal()};if(state.key){$('login').classList.add('hidden');$('app').classList.remove('hidden');loadProjects().catch(()=>logout())}
  </script>
</body>
</html>
